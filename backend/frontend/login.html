<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>登录 · InfoHub</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans SC', 'Segoe UI', sans-serif;
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #0f1117 0%, #1a1d27 100%);
    color: #e2e4eb;
  }
  .card {
    width: 100%; max-width: 400px;
    background: #1a1d27;
    border: 1px solid #2e3244;
    border-radius: 18px;
    padding: 36px 30px 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .logo {
    width: 54px; height: 54px; border-radius: 14px;
    background: linear-gradient(135deg, #6366f1, #818cf8);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; margin: 0 auto 18px;
  }
  h1 { font-size: 20px; text-align: center; margin-bottom: 6px; font-weight: 600; }
  .sub { text-align: center; color: #8b8fa3; font-size: 13px; margin-bottom: 28px; }
  label { display: block; font-size: 13px; color: #a5a9bd; margin-bottom: 7px; }
  .field { margin-bottom: 18px; }
  input {
    width: 100%; padding: 12px 14px; font-size: 15px;
    background: #242734; border: 1px solid #2e3244; border-radius: 10px;
    color: #e2e4eb; outline: none; transition: border-color .2s;
  }
  input:focus { border-color: #6366f1; }
  button {
    width: 100%; padding: 13px; font-size: 15px; font-weight: 600;
    background: #6366f1; color: #fff; border: none; border-radius: 10px;
    cursor: pointer; margin-top: 6px; transition: background .2s;
  }
  button:hover { background: #5457e5; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .err {
    display: none; margin-top: 14px; padding: 10px 12px;
    background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.35);
    color: #fca5a5; border-radius: 8px; font-size: 13px; text-align: center;
  }
  .foot { text-align: center; color: #5b5f72; font-size: 12px; margin-top: 22px; }
  @media (prefers-color-scheme: light) {
    body { background: linear-gradient(135deg, #eef0f5 0%, #dfe3ee 100%); color: #1a1d27; }
    .card { background: #fff; border-color: #e2e5ee; box-shadow: 0 20px 60px rgba(0,0,0,.1); }
    h1 { color: #1a1d27; }
    label { color: #555a6e; }
    input { background: #f5f6fa; border-color: #dfe3ee; color: #1a1d27; }
    .foot { color: #9aa0b5; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">i</div>
  <h1>InfoHub</h1>
  <p class="sub">登录后查看你的信息聚合</p>
  <form id="form">
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" id="btn">登录</button>
    <div class="err" id="err"></div>
  </form>
  <div class="foot">InfoHub · 私人信息中心</div>
</div>
<script>
  const form = document.getElementById('form');
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  function showErr(msg) { err.textContent = msg; err.style.display = 'block'; }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = '登录中…';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) { showErr(data.error || '登录失败'); return; }
      const params = new URLSearchParams(location.search);
      let target = params.get('redirect') || '/';
      // 仅允许站内相对路径，防止开放重定向
      if (!target.startsWith('/') || target.startsWith('//')) target = '/';
      location.href = target;
    } catch (ex) {
      showErr('网络错误，请重试');
    } finally {
      btn.disabled = false; btn.textContent = '登录';
    }
  });
</script>
</body>
</html>
