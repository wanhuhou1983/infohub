<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InfoHub Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg: '#0f1117', surface: '#1a1d27', surface2: '#242734',
        border: '#2e3244', accent: '#6366f1', accent2: '#818cf8',
        muted: '#8b8fa3', fg: '#e2e4eb', success: '#22c55e',
        warn: '#eab308', danger: '#ef4444',
      }
    }
  }
}
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
  body { font-family: 'Noto Sans SC', sans-serif; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0f1117; }
  ::-webkit-scrollbar-thumb { background: #2e3244; border-radius: 3px; }
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #2e3244; transition: .3s; border-radius: 22px; }
  .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; transition: .3s; border-radius: 50%; }
  input:checked + .slider { background: #6366f1; }
  input:checked + .slider:before { transform: translateX(18px); }
  .spinner { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.3s ease-out; }
</style>
</head>
<body class="bg-bg text-fg min-h-screen">
  <!-- Header -->
  <div class="border-b border-border bg-surface">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <h1 class="text-lg font-semibold">InfoHub Admin</h1>
        <span class="text-xs text-muted bg-surface2 px-2 py-0.5 rounded">信息来源管理</span>
      </div>
      <div class="flex items-center gap-3 text-sm">
        <span class="text-muted">文章总数</span>
        <span id="totalArticles" class="text-success font-bold text-lg">-</span>
                <button id="addRssBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm px-4 py-1.5 rounded-lg transition" onclick="showAddRssModal()">
          + 新增 RSS 源
        </button>
        <button id="refreshAllBtn" class="bg-accent hover:bg-accent2 text-white text-sm px-4 py-1.5 rounded-lg transition" onclick="refreshAll()">
          全部刷新
        </button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="max-w-6xl mx-auto px-4 py-6">

    <!-- Tab Bar -->
    <div class="flex gap-1 mb-4 border-b border-border">
      <button id="tab-sources" class="px-4 py-2 text-sm font-medium rounded-t-lg border border-b-0 border-accent bg-surface text-fg transition" onclick="switchTab('sources')">数据源管理</button>
      <button id="tab-stats" class="px-4 py-2 text-sm font-medium rounded-t-lg border border-b-0 border-transparent bg-transparent text-muted hover:text-fg transition" onclick="switchTab('stats')">更新日志</button>
    </div>

    <div id="tab-sources-content">
      <div id="loading" class="text-center py-16">
        <div class="spinner inline-block w-8 h-8 border-2 border-accent border-t-transparent rounded-full mb-3"></div>
        <p class="text-muted text-sm">加载中...</p>
      </div>
      <div id="cards" class="space-y-4"></div>
    </div>

    <div id="tab-stats-content" class="hidden">
      <div id="statsLoading" class="text-center py-16">
        <div class="spinner inline-block w-8 h-8 border-2 border-accent border-t-transparent rounded-full mb-3"></div>
        <p class="text-muted text-sm">加载中...</p>
      </div>
      <div id="statsCards" class="space-y-3"></div>
    </div>
  </div>

<script>
var API_BASE = '/api';
function api(path, opts) {
  opts = opts || {};
  var url = opts.url || API_BASE + path;
  var headers = Object.assign({}, opts.headers || {});
  if (opts.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
  return fetch(url, Object.assign({}, opts, { headers: headers })).then(function(r) { return r.json(); });
}

var ICONS = {
  newspaper: '\uD83D\uDCF0', rss_news: '\uD83D\uDCE1', wechat: '\uD83D\uDCAC', bilibili: '\uD83D\uDCFA',
  podcast: '\uD83C\uDF99', twitter: '\uD83D\uDC26', youtube: '\u25B6\uFE0F', xueqiu: '\u2744', weibo: '\uD83C\uDF10'
};
var COLORS = {
  newspaper: 'bg-slate-500/20 text-slate-400', rss_news: 'bg-orange-500/20 text-orange-400',
  wechat: 'bg-green-500/20 text-green-400', bilibili: 'bg-pink-500/20 text-pink-400',
  podcast: 'bg-purple-500/20 text-purple-400', twitter: 'bg-sky-500/20 text-sky-400',
  youtube: 'bg-red-500/20 text-red-400', xueqiu: 'bg-amber-500/20 text-amber-400',
  weibo: 'bg-rose-500/20 text-rose-400'
};
var TYPES = {
  newspaper: '\u62a5\u520a', rss_news: 'RSS', wechat: '\u5fae\u4fe1', bilibili: 'B\u7ad9',
  podcast: '\u64ad\u5ba2', twitter: 'Twitter', youtube: 'YouTube', xueqiu: '\u96ea\u7403', weibo: '\u5fae\u535a'
};

function load() {
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('cards').innerHTML = '';

  api('/sources/tree').then(function(tree) {
    if (!tree || !Array.isArray(tree)) throw new Error('API returned empty');

    // Sort categories in fixed order
    var CAT_ORDER = { magazine: 1, rss_news: 2, wechat: 3, bilibili: 4, youtube: 5, podcast: 6, twitter: 7, xueqiu: 8, weibo: 9 };
    tree.sort(function(a, b) {
      return (CAT_ORDER[a.type] || 99) - (CAT_ORDER[b.type] || 99);
    });

    var grandTotal = 0;
    var cardsHtml = '';

    for (var i = 0; i < tree.length; i++) {
      var cat = tree[i];
      var allSources = [];
      var catTotal = 0;

      for (var j = 0; j < (cat.children || []).length; j++) {
        var ch = cat.children[j];
        var subs = (ch.children || []);
        if (subs.length > 0) {
          for (var k = 0; k < subs.length; k++) {
            allSources.push(subs[k]);
            catTotal += (subs[k].article_count || 0);
          }
        } else {
          allSources.push(ch);
          catTotal += (ch.article_count || 0);
        }
      }

      grandTotal += catTotal;

      var sourceRows = '';
      for (var s = 0; s < allSources.length; s++) {
        var src = allSources[s];
        sourceRows += '<div class="flex items-center justify-between text-xs bg-bg rounded px-2.5 py-1.5 mb-1">' +
          '<span class="truncate flex-1">' + src.name + '</span>' +
          '<span class="text-muted mx-2">' + (src.article_count || 0) + '</span>' +
          '<label class="switch" onclick="event.stopPropagation()">' +
          '<input type="checkbox" ' + (src.enabled ? 'checked' : '') + ' onchange="toggleSource(' + src.id + ', this.checked)">' +
          '<span class="slider"></span></label></div>';
      }


      cardsHtml += '<div class="bg-surface rounded-xl border border-border p-4 hover:border-accent/30 transition fade-in">' +
        '<div class="flex items-start gap-4">' +
        '<div class="w-10 h-10 ' + (COLORS[cat.type] || 'bg-blue-500/20 text-blue-400').split(' ')[0] + ' rounded-lg flex items-center justify-center text-lg shrink-0">' + (ICONS[cat.type] || '\uD83D\uDCE6') + '</div>' +
        '<div class="flex-1 min-w-0">' +
        '<div class="flex items-center gap-2 mb-1">' +
        '<span class="font-medium text-sm">' + cat.name + '</span>' +
        '<span class="text-xs bg-surface2 text-muted px-1.5 py-0.5 rounded">' + (TYPES[cat.type] || cat.type) + '</span>' +
        '<span class="flex items-center gap-1 ml-auto">' +
        '<span class="w-1.5 h-1.5 ' + (cat.enabled ? 'bg-success' : 'bg-muted') + ' rounded-full"></span>' +
        '<span class="text-xs text-muted">' + (cat.enabled ? '\u8fd0\u884c\u4e2d' : '\u5df2\u6682\u505c') + '</span></span></div>' +
        '<p class="text-xs text-muted mb-2">' + allSources.length + ' \u4e2a\u5b50\u6e90</p>' +
        (sourceRows ? '<div class="space-y-0.5 mb-2 max-h-48 overflow-y-auto">' + sourceRows + '</div>' : '') +
        '<div class="flex items-center gap-4 text-xs text-muted">' +
        '<span>\u5171 <span class="text-fg font-medium">' + catTotal + '</span> \u7bc7</span></div></div>' +
        '<div class="flex items-center gap-2 shrink-0">' +
        '<label class="switch"><input type="checkbox" ' + (cat.enabled ? 'checked' : '') + ' onchange="toggleSource(' + cat.id + ', this.checked)"><span class="slider"></span></label>' +
        (cat.type === 'youtube' ? '<button class="bg-red-600/60 hover:bg-red-500 text-white text-xs px-2 py-1 rounded transition" onclick="event.stopPropagation();syncYoutubeFollowings()" title="同步 YouTube 关注列表">同步关注</button>' : '') +
        '</div></div></div>';
    }

    document.getElementById('totalArticles').textContent = grandTotal;
    document.getElementById('cards').innerHTML = cardsHtml;
  }).catch(function(e) {
    document.getElementById('cards').innerHTML = '<div class="text-danger text-sm p-4">加载失败: ' + e.message + '</div>';
  }).finally(function() {
    document.getElementById('loading').classList.add('hidden');
  });
}

function toggleSource(id, enabled) {
  api('/sources/' + id, { method: 'PATCH', body: JSON.stringify({ enabled: enabled }) }).then(load).catch(function(e) { console.error(e); });
}



function refreshAll() {
  var btn = document.getElementById('refreshAllBtn');
  btn.disabled = true;
  btn.textContent = '刷新中...';
  api('/jtk/refresh', { method: 'POST', body: '{}' }).catch(function(){});
  setTimeout(function() { btn.disabled = false; btn.textContent = '全部刷新'; load(); }, 5000);
}

// 一键同步所有平台的关注列表
function syncAllFollowings() {
  var btn = document.getElementById('syncFollowingsBtn');
  btn.disabled = true;
  btn.textContent = '获取中...';

  var platforms = [
    { type: 'youtube', label: 'YouTube', fetchUrl: '/youtube-admin/subscriptions', itemsKey: 'subscriptions', labelKey: 'title', idKey: 'channelId' },
    { type: 'twitter', label: 'X/Twitter', fetchUrl: '/twitter-admin/followings', itemsKey: 'followings', labelKey: 'name', idKey: 'screen_name' },
    { type: 'bilibili', label: 'B站', fetchUrl: '/bilibili-admin/uppers/followings', itemsKey: 'followings', labelKey: 'name', idKey: 'mid' }
  ];

  var allNewItems = [];
  var errors = [];

  function fetchNext(index) {
    if (index >= platforms.length) {
      btn.disabled = false;
      btn.textContent = '↻ 同步关注列表';

      if (errors.length === platforms.length) {
        alert('所有平台获取失败:\n' + errors.map(function(e) { return e.label + ': ' + e.msg; }).join('\n'));
        return;
      }

      var totalNew = 0;
      for (var i = 0; i < allNewItems.length; i++) {
        totalNew += allNewItems[i].items.length;
      }

      if (totalNew === 0) {
        alert('关注列表已是最新，无新增。');
        load();
        return;
      }

      showCombinedImportModal(allNewItems, btn);
      return;
    }

    var p = platforms[index];
    api(p.fetchUrl).then(function(data) {
      if (!data || !data[p.itemsKey]) {
        errors.push({ label: p.label, msg: data && data.error ? data.error : '无数据' });
        fetchNext(index + 1);
        return;
      }

      var items = data[p.itemsKey] || [];
      var newItems = items.filter(function(it) { return it.isNew; });

      if (newItems.length > 0) {
        allNewItems.push({
          type: p.type,
          label: p.label,
          items: newItems,
          labelKey: p.labelKey,
          idKey: p.idKey
        });
      }
      fetchNext(index + 1);
    }).catch(function(e) {
      errors.push({ label: p.label, msg: e.message });
      fetchNext(index + 1);
    });
  }

  fetchNext(0);
}

function showCombinedImportModal(platformData, btn) {
  var overlay = document.createElement('div');
  overlay.id = 'importModal';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;';

  var box = document.createElement('div');
  box.style.cssText = 'background:#1a1d27;border:1px solid #2e3244;border-radius:12px;padding:20px;max-width:550px;width:90%;max-height:75vh;display:flex;flex-direction:column;';

  var title = document.createElement('h3');
  title.style.cssText = 'color:#e2e4eb;margin:0 0 4px 0;font-size:16px;';
  title.textContent = '发现新增关注';
  box.appendChild(title);

  var totalCount = 0;
  for (var i = 0; i < platformData.length; i++) {
    totalCount += platformData[i].items.length;
  }
  var hint = document.createElement('p');
  hint.style.cssText = 'color:#8b8fa3;font-size:12px;margin:0 0 12px 0;';
  hint.textContent = '共 ' + totalCount + ' 个新增，选择要导入的项';
  box.appendChild(hint);

  var list = document.createElement('div');
  list.style.cssText = 'overflow-y:auto;flex:1;margin-bottom:12px;';

  var allCheckboxes = [];

  for (var pi = 0; pi < platformData.length; pi++) {
    var pd = platformData[pi];

    var header = document.createElement('div');
    header.style.cssText = 'color:#6366f1;font-size:13px;font-weight:600;padding:8px 4px 4px 4px;';
    header.textContent = pd.label + ' (' + pd.items.length + ')';
    list.appendChild(header);

    for (var ii = 0; ii < pd.items.length; ii++) {
      (function(pdata, item) {
        var row = document.createElement('label');
        row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:13px;color:#e2e4eb;cursor:pointer;border-radius:6px;';
        row.onmouseover = function() { this.style.background = '#242734'; };
        row.onmouseout = function() { this.style.background = ''; };

        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = true;
        cb.style.cssText = 'accent-color:#6366f1;';
        allCheckboxes.push({ cb: cb, platform: pdata, item: item });

        var span = document.createElement('span');
        span.textContent = item[pdata.labelKey] + (item[pdata.idKey] ? ' (' + item[pdata.idKey] + ')' : '');
        span.style.cssText = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';

        row.appendChild(cb);
        row.appendChild(span);
        list.appendChild(row);
      })(pd, pd.items[ii]);
    }
  }
  box.appendChild(list);

  var btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;';

  var cancelBtn = document.createElement('button');
  cancelBtn.textContent = '取消';
  cancelBtn.style.cssText = 'padding:8px 16px;border-radius:8px;border:1px solid #2e3244;background:#242734;color:#e2e4eb;cursor:pointer;font-size:13px;';
  cancelBtn.onclick = function() { document.getElementById('importModal').remove(); };

  var importBtn = document.createElement('button');
  importBtn.textContent = '导入选中';
  importBtn.style.cssText = 'padding:8px 16px;border-radius:8px;border:none;background:#6366f1;color:white;cursor:pointer;font-size:13px;';
  importBtn.onclick = function() {
    var imports = {};
    for (var i = 0; i < allCheckboxes.length; i++) {
      var entry = allCheckboxes[i];
      if (!entry.cb.checked) continue;
      var t = entry.platform.type;
      if (!imports[t]) imports[t] = [];
      imports[t].push(entry.item);
    }

    var allTypes = Object.keys(imports);
    if (allTypes.length === 0) { alert('请至少选择一个'); return; }

    importBtn.disabled = true;
    importBtn.textContent = '导入中...';

    var results = [];
    var completed = 0;
    var targetTypes = allTypes.length;

    for (var ti = 0; ti < allTypes.length; ti++) {
      var type = allTypes[ti];
      var items = imports[type];
      var url, body;
      if (type === 'youtube') {
        url = '/youtube-admin/import-subscriptions';
        body = JSON.stringify({ channelIds: items.map(function(it) { return it.channelId; }) });
      } else if (type === 'twitter') {
        url = '/twitter-admin/import-followings';
        body = JSON.stringify({ accounts: items.map(function(it) { return { screen_name: it.screen_name, name: it.name }; }) });
      } else if (type === 'bilibili') {
        url = '/bilibili-admin/uppers/import-followings';
        body = JSON.stringify({ uppers: items.map(function(it) { return { mid: it.mid, name: it.name }; }) });
      }

      api(url, { method: 'POST', body: body }).then(function(r) {
        if (r && r.ok) {
          results.push(type + ': +' + (r.imported || 0) + ' 跳过 ' + (r.skipped || 0));
        } else {
          results.push(type + ': 失败 - ' + (r && r.error || '未知错误'));
        }
      }).catch(function(e) {
        results.push(type + ': 失败 - ' + e.message);
      }).finally(function() {
        completed++;
        if (completed >= targetTypes) {
          alert('导入完成:\n' + results.join('\n'));
          document.getElementById('importModal').remove();
          load();
        }
      });
    }
  };

  btnRow.appendChild(cancelBtn);
  btnRow.appendChild(importBtn);
  box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}


// ========== 新增 RSS 源 ==========
function showAddRssModal() {
  var overlay = document.createElement('div');
  overlay.id = 'addRssModal';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;';

  var box = document.createElement('div');
  box.style.cssText = 'background:#1a1d27;border:1px solid #2e3244;border-radius:12px;padding:24px;max-width:460px;width:90%;';

  var title = document.createElement('h3');
  title.style.cssText = 'color:#e2e4eb;margin:0 0 16px 0;font-size:16px;';
  title.textContent = '新增 RSS 源';
  box.appendChild(title);

  // RSS URL input
  var urlLabel = document.createElement('label');
  urlLabel.style.cssText = 'display:block;color:#8b8fa3;font-size:12px;margin-bottom:4px;';
  urlLabel.textContent = 'RSS 地址';
  box.appendChild(urlLabel);
  var urlInput = document.createElement('input');
  urlInput.type = 'text';
  urlInput.placeholder = 'https://example.com/feed.xml';
  urlInput.style.cssText = 'width:100%;padding:8px 12px;background:#0f1117;border:1px solid #2e3244;border-radius:8px;color:#e2e4eb;font-size:13px;margin-bottom:12px;outline:none;box-sizing:border-box;';
  box.appendChild(urlInput);

  // Category select
  var catLabel = document.createElement('label');
  catLabel.style.cssText = 'display:block;color:#8b8fa3;font-size:12px;margin-bottom:4px;';
  catLabel.textContent = '分类';
  box.appendChild(catLabel);
  var catSelect = document.createElement('select');
  catSelect.style.cssText = 'width:100%;padding:8px 12px;background:#0f1117;border:1px solid #2e3244;border-radius:8px;color:#e2e4eb;font-size:13px;margin-bottom:16px;outline:none;box-sizing:border-box;';

  // Fetch categories from /sources/tree
  api('/sources/tree').then(function(tree) {
    var cats = {};
    for (var i = 0; i < (tree || []).length; i++) {
      var c = tree[i];
      if (c.type === 'youtube' || c.type === 'wechat') continue; // skip platform-specific
      cats[c.id] = { name: c.name, type: c.type };
    }
    // Add custom option for new category
    for (var id in cats) {
      var opt = document.createElement('option');
      opt.value = id;
      opt.textContent = cats[id].name + ' (' + cats[id].type + ')';
      catSelect.appendChild(opt);
    }
    // Add a separator and "新建分类" option
    var sep = document.createElement('option');
    sep.disabled = true;
    sep.textContent = '──────────';
    catSelect.appendChild(sep);
    var newCat = document.createElement('option');
    newCat.value = '__new__';
    newCat.textContent = '新建分类...';
    catSelect.appendChild(newCat);
  }).catch(function(e) {
    // fallback: just show a text input
    console.error('Failed to load categories:', e);
  });

  box.appendChild(catSelect);

  // Name input (only shown for custom category)
  var nameRow = document.createElement('div');
  nameRow.style.cssText = 'display:none;margin-bottom:12px;';
  var nameLabel = document.createElement('label');
  nameLabel.style.cssText = 'display:block;color:#8b8fa3;font-size:12px;margin-bottom:4px;';
  nameLabel.textContent = '分类名称';
  nameRow.appendChild(nameLabel);
  var nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.placeholder = '如：金融快讯';
  nameInput.style.cssText = 'width:100%;padding:8px 12px;background:#0f1117;border:1px solid #2e3244;border-radius:8px;color:#e2e4eb;font-size:13px;outline:none;box-sizing:border-box;';
  nameRow.appendChild(nameInput);
  box.appendChild(nameRow);

  // Source name input
  var srcNameLabel = document.createElement('label');
  srcNameLabel.style.cssText = 'display:block;color:#8b8fa3;font-size:12px;margin-bottom:4px;';
  srcNameLabel.textContent = '源名称（可选，留空自动从 RSS 获取）';
  box.appendChild(srcNameLabel);
  var srcNameInput = document.createElement('input');
  srcNameInput.type = 'text';
  srcNameInput.placeholder = '自动获取';
  srcNameInput.style.cssText = 'width:100%;padding:8px 12px;background:#0f1117;border:1px solid #2e3244;border-radius:8px;color:#e2e4eb;font-size:13px;margin-bottom:16px;outline:none;box-sizing:border-box;';
  box.appendChild(srcNameInput);

  catSelect.onchange = function() {
    nameRow.style.display = catSelect.value === '__new__' ? 'block' : 'none';
  };

  // Buttons
  var btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;';

  var cancelBtn = document.createElement('button');
  cancelBtn.textContent = '取消';
  cancelBtn.style.cssText = 'padding:8px 16px;border-radius:8px;border:1px solid #2e3244;background:#242734;color:#e2e4eb;cursor:pointer;font-size:13px;';
  cancelBtn.onclick = function() { overlay.remove(); };

  var submitBtn = document.createElement('button');
  submitBtn.textContent = '添加';
  submitBtn.style.cssText = 'padding:8px 16px;border-radius:8px;border:none;background:#6366f1;color:white;cursor:pointer;font-size:13px;';
  submitBtn.onclick = function() {
    var url = urlInput.value.trim();
    if (!url) { alert('请输入 RSS 地址'); return; }

    var catId = catSelect.value;
    var catName = nameInput.value.trim();
    var srcName = srcNameInput.value.trim();

    if (catId === '__new__' && !catName) { alert('请输入分类名称'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = '添加中...';

    var body = { feed_url: url, name: srcName || undefined };
    if (catId === '__new__') {
      body.new_category = catName;
    } else {
      body.parent_id = parseInt(catId);
    }

    api('/sources/rss', { method: 'POST', body: JSON.stringify(body) }).then(function(r) {
      if (r && r.ok) {
        overlay.remove();
        load();
      } else {
        alert('添加失败: ' + (r && r.error ? r.error : '未知错误'));
        submitBtn.disabled = false;
        submitBtn.textContent = '添加';
      }
    }).catch(function(e) {
      alert('添加失败: ' + e.message);
      submitBtn.disabled = false;
      submitBtn.textContent = '添加';
    });
  };

  btnRow.appendChild(cancelBtn);
  btnRow.appendChild(submitBtn);
  box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  urlInput.focus();
}

// ========== YouTube 同步关注列表 ==========
function syncYoutubeFollowings() {
  var overlay = document.createElement('div');
  overlay.id = 'ytSyncModal';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;';
  
  var box = document.createElement('div');
  box.style.cssText = 'background:#1a1d27;border:1px solid #2e3244;border-radius:12px;padding:24px;text-align:center;';
  var msg = document.createElement('p');
  msg.textContent = '正在获取 YouTube 关注列表...';
  msg.style.cssText = 'color:#e2e4eb;font-size:14px;';
  box.appendChild(msg);
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  api('/youtube-admin/subscriptions').then(function(data) {
    overlay.remove();
    if (!data || !data.subscriptions) {
      alert('获取失败: ' + (data && data.error ? data.error : '无数据'));
      return;
    }
    var newItems = (data.subscriptions || []).filter(function(it) { return it.isNew; });
    if (newItems.length === 0) {
      alert('关注列表已是最新，无新增');
      return;
    }
    showCombinedImportModal([{
      type: 'youtube',
      label: 'YouTube',
      items: newItems,
      labelKey: 'title',
      idKey: 'channelId'
    }]);
  }).catch(function(e) {
    overlay.remove();
    alert('获取失败: ' + e.message);
  });
}

// ====== keep old syncAllFollowings for backwards compat ======
function syncAllFollowings() { syncYoutubeFollowings(); }

// ====== Tab switching ======
var currentTab = 'sources';
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-sources').className = tab === 'sources'
    ? 'px-4 py-2 text-sm font-medium rounded-t-lg border border-b-0 border-accent bg-surface text-fg transition'
    : 'px-4 py-2 text-sm font-medium rounded-t-lg border border-b-0 border-transparent bg-transparent text-muted hover:text-fg transition';
  document.getElementById('tab-stats').className = tab === 'stats'
    ? 'px-4 py-2 text-sm font-medium rounded-t-lg border border-b-0 border-accent bg-surface text-fg transition'
    : 'px-4 py-2 text-sm font-medium rounded-t-lg border border-b-0 border-transparent bg-transparent text-muted hover:text-fg transition';
  document.getElementById('tab-sources-content').classList.toggle('hidden', tab !== 'sources');
  document.getElementById('tab-stats-content').classList.toggle('hidden', tab !== 'stats');
  if (tab === 'sources' && !document.getElementById('cards').children.length) load();
  if (tab === 'stats') loadStats();
}

// ====== Stats / 更新日志 ======
function loadStats() {
  document.getElementById('statsLoading').classList.remove('hidden');
  document.getElementById('statsCards').innerHTML = '';

  api('/sources/stats').then(function(data) {
    document.getElementById('statsLoading').classList.add('hidden');

    if (!Array.isArray(data) || data.length === 0) {
      document.getElementById('statsCards').innerHTML = '<div class="text-center text-muted text-sm py-12">过去24小时内无新增文章</div>';
      return;
    }

    var totalArt = 0;
    for (var i = 0; i < data.length; i++) totalArt += data[i].count;

    var html = '<div class="text-xs text-muted mb-3">过去24小时，' + data.length + ' 个信息源共新增 <span class="text-fg font-medium">' + totalArt + '</span> 篇</div>';

    html += '<div class="bg-surface rounded-xl border border-border overflow-hidden">';
    html += '<table class="w-full text-sm">';
    html += '<thead><tr class="border-b border-border text-xs text-muted">';
    html += '<th class="text-left px-4 py-2 font-medium">信息源</th>';
    html += '<th class="text-left px-4 py-2 font-medium">类型</th>';
    html += '<th class="text-right px-4 py-2 font-medium">新增篇数</th>';
    html += '<th class="text-right px-4 py-2 font-medium">最新抓取</th>';
    html += '</tr></thead><tbody>';

    for (var i = 0; i < data.length; i++) {
      var r = data[i];
      var typeLabel = TYPES[r.source_type] || r.source_type;
      var typeColor = COLORS[r.source_type] || 'bg-slate-500/20 text-slate-400';
      var lastFetch = r.last_fetch ? new Date(r.last_fetch).toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit', month: 'numeric', day: 'numeric' }) : '-';
      var rowBg = i % 2 === 0 ? '' : 'bg-surface2/30';

      html += '<tr class="border-b border-border/50 ' + rowBg + ' hover:bg-surface2/50 transition">';
      html += '<td class="px-4 py-2.5 font-medium truncate max-w-[200px]">' + r.source_name + '</td>';
      html += '<td class="px-4 py-2.5"><span class="text-xs px-1.5 py-0.5 rounded ' + typeColor + '">' + typeLabel + '</span></td>';
      html += '<td class="px-4 py-2.5 text-right"><span class="text-success font-medium">' + r.count + '</span></td>';
      html += '<td class="px-4 py-2.5 text-right text-muted text-xs">' + lastFetch + '</td>';
      html += '</tr>';
    }

    html += '</tbody></table></div>';
    document.getElementById('statsCards').innerHTML = html;
  }).catch(function(e) {
    document.getElementById('statsLoading').classList.add('hidden');
    document.getElementById('statsCards').innerHTML = '<div class="text-danger text-sm p-4">加载失败: ' + e.message + '</div>';
  });
}

document.addEventListener('DOMContentLoaded', load);
</script>
