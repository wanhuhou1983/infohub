on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy env'
        type: choice
        default: 'production'
        options:
          - production
      image_tag:
        description: 'Image tag'
        type: string
        default: ''

jobs:
  check:
    name: Type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install
      - name: TypeScript check
        run: bun x tsc --noEmit
      - name: Run tests
        run: bun test

  build:
    name: Build & Push
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/infohub-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Generate image tags
        id: meta
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${{ github.ref_name }}-${SHORT}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/infohub-backend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/infohub-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: [build]
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/infohub-backend
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script_stop: true
          command_timeout: '30m'
          script: |
            set -e
            echo "=== 1. Login GHCR ==="
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "=== 2. Pull latest (retry on flaky cross-border network) ==="
            PULLED=0
            for i in 1 2 3 4; do
              if docker pull ghcr.io/${{ github.repository }}/infohub-backend:latest; then PULLED=1; break; fi
              echo "pull attempt $i failed, retrying..."
              sleep 5
            done
            [ "$PULLED" = "1" ] || { echo "docker pull failed after retries"; exit 1; }
            echo "=== 3. Restart container ==="
            docker stop infohub-backend 2>/dev/null || true
            docker rm infohub-backend 2>/dev/null || true
            # 配置统一维护在 /opt/infohub/.env.json（含 DATABASE_URL 与全部凭据），
            # 部署时派生为 docker --env-file，使模块顶层常量在求值时即可读到。
            # 凭据不落仓库；文件缺失直接失败，避免静默使用错误配置。
            test -f /opt/infohub/.env.json || { echo "missing /opt/infohub/.env.json"; exit 1; }
            sudo python3 -c "import json,os; d=json.load(open('/opt/infohub/.env.json')); f=open('/opt/infohub/backend.env','w'); [f.write('%s=%s\n'%(k,v)) for k,v in d.items() if isinstance(v,(str,int,float,bool))]; f.close(); os.chmod('/opt/infohub/backend.env',0o600)"
            sudo chown $(id -u):$(id -g) /opt/infohub/backend.env
            docker run -d \
              --name infohub-backend \
              --restart unless-stopped \
              -p 3001:3001 \
              --env-file /opt/infohub/backend.env \
              -e CLOUD_MODE=true \
              -e TZ=Asia/Shanghai \
              -v /opt/infohub/data:/app/data \
              -v /opt/infohub/.env.json:/.env.json:ro \
              --network infohub-net \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              ghcr.io/${{ github.repository }}/infohub-backend:latest
            # 微信正文四层降级的第一层；镜像由 cloud-ops 流程构建一次，这里保证容器常驻。
            if ! docker ps --format '{{.Names}}' | grep -qx 'wechat-service'; then
              docker rm -f wechat-service 2>/dev/null || true
              if docker image inspect infohub-wechat-service:latest >/dev/null 2>&1; then
                docker run -d --name wechat-service --restart unless-stopped \
                  --network infohub-net infohub-wechat-service:latest
                echo "wechat-service started"
              else
                echo "WARN: wechat-service image missing, WeChat fetch will use degraded layers"
              fi
            fi
            echo "=== 4. Health check ==="
            sleep 3
            curl -f http://localhost:3001/api/test
            echo ""
            echo "=== 5. Collector logs (first 20s) ==="
            sleep 20
            docker logs --tail 60 infohub-backend 2>&1 | grep -iE 'cloud-collector|error' | tail -20 || true
            echo "Done!"
