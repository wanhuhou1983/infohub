on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy env'
        type: choice
        default: 'production'
        options:
          - production
      image_tag:
        description: 'Image tag'
        type: string
        default: ''

jobs:
  check:
    name: Type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install
      - name: TypeScript check
        run: bun x tsc --noEmit
      - name: Run tests
        run: bun test

  build:
    name: Build & Push
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/infohub-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Generate image tags
        id: meta
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          TAG="${{ inputs.image_tag || format('{0}-{1}', github.ref_name, SHORT) }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/infohub-backend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/infohub-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: [build]
    runs-on: ubuntu-latest
    if: secrets.DEPLOY_HOST != ''
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/infohub-backend
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            echo "=== 1. Login GHCR ==="
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "=== 2. Pull latest ==="
            docker pull ghcr.io/${{ github.repository }}/infohub-backend:latest
            echo "=== 3. Restart container ==="
            docker stop infohub-backend 2>/dev/null || true
            docker rm infohub-backend 2>/dev/null || true
            docker run -d \
              --name infohub-backend \
              --restart unless-stopped \
              -p 3001:3001 \
              -v /opt/infohub/data:/app/data \
              -v /opt/infohub/.env.json:/app/.env.json:ro \
              --network infohub-net \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              ghcr.io/${{ github.repository }}/infohub-backend:latest
            echo "=== 4. Health check ==="
            sleep 3
            curl -f http://localhost:3001/api/test
            echo "Done!"
