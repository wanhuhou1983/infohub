name: InfoHub Cloud Ops

# 云端轻量运维入口：不构建镜像、不重启后端，只检查/补齐辅助容器并输出健康信息。
# 用于在本机无法直连服务器时，通过仓库已配置的 DEPLOY_KEY 执行云端操作。
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Operation to run'
        type: choice
        default: 'ensure-services'
        options:
          - ensure-services
          - status
          - deploy

jobs:
  ops:
    name: Cloud ops
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script_stop: true
          command_timeout: '20m'
          script: |
            set -e
            ACTION='${{ inputs.action }}'
            echo "=== action: $ACTION ==="
            if [ "$ACTION" = "ensure-services" ]; then
              if ! docker ps --format '{{.Names}}' | grep -qx 'wechat-service'; then
                docker rm -f wechat-service 2>/dev/null || true
                docker run -d \
                  --name wechat-service \
                  --restart unless-stopped \
                  --network infohub-net \
                  infohub-wechat-service:latest
                echo "wechat-service started"
              else
                echo "wechat-service already running"
              fi
            fi
            if [ "$ACTION" = "deploy" ]; then
              echo "=== pull new image (3 attempts, 300s timeout each) ==="
              PULLED=0
              for i in 1 2 3; do
                if timeout 300 docker pull ghcr.io/${{ github.repository }}/infohub-backend:latest; then PULLED=1; break; fi
                echo "pull attempt $i failed"
                sleep 3
              done
              if [ "$PULLED" != "1" ]; then
                echo "PULL_FAILED - local images:"
                docker images --format '{{.Repository}}:{{.Tag}}|{{.ID}}|{{.Size}}' | head -10
                exit 1
              fi
              echo "=== prepare env-file from /opt/infohub/.env.json ==="
              sudo python3 -c "import json,os; d=json.load(open('/opt/infohub/.env.json')); f=open('/opt/infohub/backend.env','w'); [f.write('%s=%s\n'%(k,v)) for k,v in d.items() if isinstance(v,(str,int,float,bool))]; f.close(); os.chmod('/opt/infohub/backend.env',0o600)"
              sudo chown $(id -u):$(id -g) /opt/infohub/backend.env
              echo "=== restart backend with new image ==="
              docker stop infohub-backend 2>/dev/null || true
              docker rm infohub-backend 2>/dev/null || true
              docker run -d \
                --name infohub-backend \
                --restart unless-stopped \
                -p 3001:3001 \
                --env-file /opt/infohub/backend.env \
                -e CLOUD_MODE=true \
                -e TZ=Asia/Shanghai \
                -v /opt/infohub/data:/app/data \
                -v /opt/infohub/.env.json:/.env.json:ro \
                --network infohub-net \
                --log-opt max-size=10m \
                --log-opt max-file=3 \
                ghcr.io/${{ github.repository }}/infohub-backend:latest
              sleep 8
            fi
            echo "=== containers ==="
            docker ps --format '{{.Names}}|{{.Status}}|{{.Image}}'
            echo "=== backend /api/test ==="
            curl -fsS --max-time 10 http://localhost:3001/api/test || echo "api/test FAILED"
            echo ""
            echo "=== backend env (names only) ==="
            docker inspect infohub-backend --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | sed 's/=.*/=<set>/' \
              | grep -E 'CLOUD_MODE|COLLECTOR_MODE|TZ=|JTK_USER|COS_BUCKET|OB_WRITE_ENABLED|WECHAT_SERVICE_URL|INTERNAL_FETCH_TOKEN' | sort || true
            echo "=== wechat-service health (from backend container) ==="
            sleep 5
            docker exec infohub-backend sh -c 'wget -qO- --timeout=6 http://wechat-service:8978/health' 2>&1 | head -c 300 || true
            echo ""
            echo "=== wechat-service logs ==="
            docker logs --tail 15 wechat-service 2>&1 | tail -15 || true
            echo "=== backend logs (last 80 lines) ==="
            docker logs --tail 80 infohub-backend 2>&1 | tail -80 || true
