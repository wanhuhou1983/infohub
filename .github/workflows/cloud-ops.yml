name: InfoHub Cloud Ops

# 云端轻量运维入口：不构建镜像、不重启后端，只检查/补齐辅助容器并输出健康信息。
# 用于在本机无法直连服务器时，通过仓库已配置的 DEPLOY_KEY 执行云端操作。
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Operation to run'
        type: choice
        default: 'ensure-services'
        options:
          - ensure-services
          - status

jobs:
  ops:
    name: Cloud ops
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script_stop: true
          command_timeout: '10m'
          script: |
            set -e
            ACTION='${{ inputs.action }}'
            echo "=== action: $ACTION ==="
            if [ "$ACTION" = "ensure-services" ]; then
              if ! docker ps --format '{{.Names}}' | grep -qx 'wechat-service'; then
                docker rm -f wechat-service 2>/dev/null || true
                docker run -d \
                  --name wechat-service \
                  --restart unless-stopped \
                  --network infohub-net \
                  infohub-wechat-service:latest
                echo "wechat-service started"
              else
                echo "wechat-service already running"
              fi
            fi
            echo "=== containers ==="
            docker ps --format '{{.Names}}|{{.Status}}|{{.Image}}'
            echo "=== backend /api/test ==="
            curl -fsS --max-time 10 http://localhost:3001/api/test || echo "api/test FAILED"
            echo ""
            echo "=== backend env (names only) ==="
            docker inspect infohub-backend --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | sed 's/=.*/=<set>/' \
              | grep -E 'CLOUD_MODE|COLLECTOR_MODE|TZ=|JTK_USER|COS_BUCKET|OB_WRITE_ENABLED|WECHAT_SERVICE_URL|INTERNAL_FETCH_TOKEN' | sort || true
            echo "=== wechat-service health (from backend container) ==="
            docker exec infohub-backend sh -c 'wget -qO- --timeout=6 http://wechat-service:8978/health' 2>&1 | head -c 300 || true
            echo ""
            echo "=== cloud-collector logs ==="
            docker logs --tail 150 infohub-backend 2>&1 | grep -iE 'cloud-collector|collector|error' | tail -30 || true
