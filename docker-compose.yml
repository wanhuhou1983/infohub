# InfoHub s1 部署 - 连接已有 quant-postgres
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infohub-backend
    environment:
      DATABASE_URL: postgres://infohub:infohub123@quant-postgres:5432/infohub
      PORT: "3001"
      REQUIRE_AUTH: "true"
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ALLOWED_ORIGIN: https://wuflux.cn,https://info.wuflux.cn
      CLOUD_MODE: "false"
      HOME: /root
      OB_DIR: /obsidian
      WEFLOW_URL: http://127.0.0.1:5031
      WEFLOW_TOKEN: 86ec59e61b587f1b97ad227a1ec12476
      OLLAMA_BASE_URL: http://172.18.0.1:11435
      OLLAMA_TRANSLATE_MODEL: gemma4:26b
      OB_ATTACHMENTS_DIR: /obsidian/附件
      SYNC_TOKEN: ${SYNC_TOKEN}
    networks:
      - quant-network
    ports:
      - "3001:3001"
    volumes:
      - /mnt/c/Users/linhu/Documents/infohub:/obsidian
      - ./frontend:/app/frontend       # 前端静态文件
    restart: unless-stopped

networks:
  quant-network:
    external: true
